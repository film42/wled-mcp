[package]
name = "wled-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "1.3", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.12", features = ["json"] }
mdns-sd = "0.18"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
